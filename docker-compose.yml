version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skills-platform-db
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skills-platform-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ai:ai@postgres:5432/ai
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AES_KEY: ${AES_KEY:-0123456789abcdef0123456789abcdef}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skills-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
